{% extends "kanban/base.html" %}
{% block title %}My boards · Team Task Board{% endblock %}
{% block body_attrs %}data-page="boards"{% endblock %}
{% block content %}
<header class="ttb-board-header">
  <div class="container-fluid px-3 px-lg-4 d-flex flex-wrap align-items-center justify-content-between gap-2 py-3">
    <div>
      <h1 class="h5 fw-bold mb-0">My boards</h1>
      <div class="ttb-meta" id="boardsSummary">&nbsp;</div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <div class="ttb-search">
        <i class="bi bi-search"></i>
        <input type="search" id="boardSearch" class="form-control" placeholder="Search boards…" aria-label="Search boards">
      </div>
      <button class="btn btn-primary" id="btnNewBoard"><i class="bi bi-plus-lg me-1"></i>New board</button>
    </div>
  </div>
</header>
<main class="container-fluid px-3 px-lg-4 py-4">
  <div class="ttb-board-grid" id="boardGrid" aria-live="polite">
    {% for i in range(3) %}<div class="ttb-skel ttb-skel-board"></div>{% endfor %}
  </div>
</main>
{% endblock %}
