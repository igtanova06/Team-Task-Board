<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Team Task Board{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='kanban/css/kanban.css') }}" rel="stylesheet">
</head>
<body {% block body_attrs %}{% endblock %}>
  {% block nav %}
  <nav class="navbar navbar-expand-md ttb-navbar sticky-top">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('main.index') }}">
        <span class="ttb-logo"><i class="bi bi-kanban-fill"></i></span><span>Team Task Board</span>
      </a>
      {% if current_user.is_authenticated %}
      <div class="ms-auto dropdown">
        <button class="btn btn-ghost d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="ttb-avatar av-owner">{{ current_user.username[:2]|upper }}</span>
          <span class="d-none d-sm-inline fw-medium small">{{ current_user.username }}</span>
          <i class="bi bi-chevron-down small"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
          <li><h6 class="dropdown-header">{{ current_user.email }}</h6></li>
          <li><a class="dropdown-item" href="{{ url_for('auth.change_password') }}"><i class="bi bi-shield-lock me-2"></i>Change password</a></li>
          <li><hr class="dropdown-divider"></li>
          <li>
            <form method="post" action="{{ url_for('auth.logout') }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
            </form>
          </li>
        </ul>

      </div>
      {% endif %}
    </div>
  </nav>
  {% endblock %}

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
