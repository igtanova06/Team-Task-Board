<!-- Create / edit / delete board. Driven by static/kanban/js/boards.js (Fetch -> /api/boards). -->
<div class="modal fade" id="boardModal" tabindex="-1" aria-labelledby="boardModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="boardForm" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h6 fw-semibold" id="boardModalTitle">New board</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger py-2 small d-none" id="boardFormAlert" role="alert"></div>
        <div class="mb-3">
          <label class="form-label d-flex justify-content-between" for="bName"><span>Name <span class="text-danger">*</span></span><span class="ttb-meta" id="bNameCount">0/100</span></label>
          <input id="bName" name="name" class="form-control" maxlength="100" placeholder="e.g. Final project" autocomplete="off">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-1">
          <label class="form-label" for="bDescription">Description</label>
          <textarea id="bDescription" name="description" class="form-control" rows="3" maxlength="2000" placeholder="What is this board for?"></textarea>
          <div class="invalid-feedback"></div>
        </div>
        <div class="ttb-danger-zone d-none" id="boardDangerZone">
          <div class="ttb-section-label text-danger mb-2">Danger zone</div>
          <div id="boardDeleteArea"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="boardSubmit">Create board</button>
      </div>
    </form>
  </div>
</div>
